[workspace]
resolver = "2"
members = ["crates/caretline", "crates/caretline-cli", "crates/caretline-mcp", "crates/caretline-layers"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/brancusi/caretline"

[workspace.dependencies]
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
# No features here: the engine inherits this, and serde_json features (`preserve_order`,
# `arbitrary_precision`) apply to a host's whole build. Binaries add their own.
serde_json = "1"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
