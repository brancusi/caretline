[package]
name = "caretline-cli"
description = "caretline: a terminal text editor on the caretline engine, with state snapshots and exact replay"
version = "0.4.2"
edition.workspace = true
license = "MIT"
repository.workspace = true
homepage = "https://caretline.app"
documentation = "https://caretline.app/docs/cli/"
readme = "README.md"
keywords = ["editor", "text-editor", "terminal", "replay", "collaboration"]
categories = ["text-editors", "command-line-utilities"]

[[bin]]
name = "caretline"
path = "src/main.rs"

[dependencies]
caretline = { path = "../caretline", version = "0.4.0" }
# Hints, arrows and spotlights (`caretline demo layers`), and the kitty pixel plumbing.
caretline-layers = { path = "../caretline-layers", version = "0.1.0", features = ["kitty"] }
# The CLI's pixel renderers (panels, arrows, rings, veils) in Ghostty.
tiny-skia = "0.11.4"
unicode-segmentation = "1.13"
ratatui = "0.30"
crossterm = { version = "0.29", features = ["use-dev-tty"] }
# Insertion-ordered JSON objects for this binary's own output (not the engine's: it is a
# library, and the feature would apply to every crate in a host's build).
serde_json = { workspace = true, features = ["preserve_order"] }
clap = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
# Tests run the layers conformance kit over `demo layers`.
caretline-layers = { path = "../caretline-layers", version = "0.1.0", features = ["kitty", "conformance"] }
