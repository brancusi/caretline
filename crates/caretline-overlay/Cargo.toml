[package]
name = "caretline-overlay"
description = "Hints, arrows, callouts and spotlights over a caretline host's screen: layers as data, a pure layout into a serializable scene, and a cell renderer"
version = "0.1.0"
edition.workspace = true
license = "MIT"
repository.workspace = true
homepage = "https://caretline.app"
readme = "README.md"
keywords = ["overlay", "tui", "hints", "editor", "caretline"]
categories = ["command-line-interface", "text-editors"]

# Pure: no clock, randomness, I/O, terminal or async in the default features. The `ratatui`
# feature adds a `CellGrid` for ratatui's `Buffer` and a `Theme`, and nothing else.
[lib]
doctest = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
unicode-segmentation = "1.13"
# The engine's pinned width table, so overlay text measures as the editor's text does.
unicode-width = "=0.1.12"
caretline = { path = "../caretline", version = "0.3", optional = true }
ratatui = { version = "0.30", default-features = false, optional = true }

[features]
default = ["caretline"]
# Resolve anchors from a caretline `Frame` and map text anchors through a `ChangeSet`.
caretline = ["dep:caretline"]
# `impl CellGrid for ratatui::buffer::Buffer` and a `Theme` of ratatui styles.
ratatui = ["dep:ratatui"]

[dev-dependencies]
# The example runs in a terminal; the library's `ratatui` feature never pulls a backend.
ratatui = "0.30"

[[example]]
name = "overlay_ratatui"
required-features = ["ratatui"]
