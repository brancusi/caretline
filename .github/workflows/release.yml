name: caretline release check

# Releases are made locally by scripts/release.sh, which builds all four binaries, publishes
# the GitHub release install.sh reads, and pushes the tag. This workflow is the background
# check on that: each target rebuilt on its own runner through the same scripts/dist.sh
# (tests, build, smoke test, package). It never creates, gates or publishes a release.
# If a tagged release is missing a target's files, it uploads them, so a gap fills itself.
# Manual runs (workflow_dispatch) build and smoke-test every target, uploading nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-darwin, test: true }
          - { os: macos-15, target: x86_64-apple-darwin, test: false }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl, test: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, test: true }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      T: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: caretline-${{ matrix.target }}

      - name: Tag matches caretline-cli
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="$(sed -n 's/^version = "\(.*\)"/\1/p' crates/caretline-cli/Cargo.toml | head -1)"
          [ "${GITHUB_REF#refs/tags/v}" = "$v" ] || { echo "Tag ${GITHUB_REF#refs/tags/} doesn't match crates/caretline-cli ($v)." >&2; exit 1; }

      - name: musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools

      - name: Tests
        if: matrix.test
        run: cargo test -p caretline -p caretline-cli

      - name: Build, smoke test, package
        run: scripts/dist.sh "$T"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: caretline-${{ matrix.target }}
          path: dist/*.tar.gz*

      - name: Fill a gap in the release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if ! assets="$(gh release view "$tag" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"; then
            echo "no release $tag (scripts/release.sh makes it): nothing to fill"
            exit 0
          fi
          for f in dist/*.tar.gz dist/*.tar.gz.sha256; do
            if echo "$assets" | grep -qx "$(basename "$f")"; then
              echo "$(basename "$f"): already in $tag"
            else
              gh release upload "$tag" "$f" -R "$GITHUB_REPOSITORY"
              echo "$(basename "$f"): was missing, uploaded"
            fi
          done
